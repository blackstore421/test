<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Store | Premium FiveM Assets</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #fff;
            overflow-x: hidden;
        }

        .spotify-card {
            background: #121212;
            border-radius: 12px;
            padding: 16px;
            transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .spotify-card:hover {
            background: #1f1f1f;
        }

        .img-container {
            aspect-ratio: 1;
            background: #282828;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .spotify-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        .btn-paypal {
            background-color: #0070ba;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 14px 36px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 112, 186, 0.2);
        }
        .btn-paypal:hover {
            transform: scale(1.05);
            background-color: #005ea6;
        }

        .btn-discord {
            background-color: #5865F2;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 14px 36px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.2);
        }
        .btn-discord:hover {
            transform: scale(1.05);
            background-color: #4752c4;
        }

        .section-header {
            border-left: 3px solid #fff;
            padding-left: 1rem;
            margin-bottom: 2rem;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes slide-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-cart { animation: slide-in 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        .rating-badge {
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        .paypal-glow {
            box-shadow: 0 0 50px rgba(0, 112, 186, 0.1);
        }

        .step-number {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            -webkit-text-stroke: 1px rgba(255,255,255,0.1);
            color: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PAYPAL_LINK = "https://www.paypal.com"; 
        const DISCORD_LINK = "https://discord.gg/CaN4PcNkR2";

        const PRODUCTS = [
            { id: 10, name: "Custom discord Programming", category: "Programming", price: 25.00, image: "https://cdn3.emoji.gg/emojis/18148-developer-badge.png", rating: 5.0, description: "bot discord Information about opening the server and bot system ." },
            { id: 9, name: "Custom fivem Programming", category: "Programming", price: 30.00, image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRg6DQ9nS42PFrISGnBkCphoos2eYFU3b1O4A&s", rating: 5.0, description: "devlop sever five." },
            { id: 5, name: "Citizen cars Pack. 1", category: "Cars", price: 55.00, image: "https://img.gta5-mods.com/q95/images/lore-friendly-tuning-colors-add-on/87ba2d-20210101020836_1.jpg", rating: 4.9, description: "5 Citizen cars by black store." },
            { id: 6, name: "POLICE Israel Pack", category: "Cars", price: 24.99, image: "https://img.gta5-mods.com/q75/images/israel-kia-sorento-add-on-fivem-ready-replace-els/446827-1.png", rating: 4.8, description: "Rugged terrain vehicles for Blaine County." },
            { id: 2, name: "Soon", category: "Maps", price: 0.0, image: "https://images.unsplash.com/photo-1614332287897-cdc485fa562d?q=80&w=600&auto=format&fit=crop", rating: 5.0, description: "Soon." },
            { id: 7, name: "Soon", category: "Maps", price: 0.0, image: "https://images.unsplash.com/photo-1511886929837-354d827aae26?q=80&w=600&auto=format&fit=crop", rating: 4.7, description: "Soon." },
            { id: 1, name: "black store سكربت بكج الاداره", category: "Scripts", price: 39.99, image: "https://media.discordapp.net/attachments/1490826181883461772/1494479198289662114/banerr.png?ex=69f9d3f6&is=69f88276&hm=dc76513a5133a4db45cd169277bf8bab2110a00af25b73b12c47bc81e7f857b8&=&format=webp&quality=lossless", rating: 4.9, description: "سكربت بكج الاداره." },
            { id: 4, name: "casino Script", category: "Scripts", price: 29.99, image: "https://img.magnific.com/vector-gratis/ilustracion-realista-juegos-casino_52683-99917.jpg?semt=ais_hybrid&w=740&q=80", rating: 5.0, description: "Script CASINO." },
            { id: 8, name: "black store صحه Script", category: "Scripts", price: 29.99, image: "https://play-lh.googleusercontent.com/jPOvRV-FWcLdjOjxmbXE-T1lSq3y2EKT4ChDYaa7tr6f3US1B9TmXaKKo9lD9q9NfRQ=w240-h480-rw", rating: 5.0, description: "Script seha." },
            { id: 3, name: "Citizen Clothes Pack", category: "Clothes", price: 24.99, image: "https://media.discordapp.net/attachments/1498289607136120936/1500941325414174891/image.png?ex=69fa440a&is=69f8f28a&hm=eb739238406a8c0023911d3918cb3b792937dec1817714d928f9242773d95a3f&=&format=webp&quality=lossless", rating: 4.6, description: "Citizen Clothes Pack." }
        ];

        function ProductCard({ product, onAdd }) {
            return (
                <div className="spotify-card flex flex-col group">
                    <div className="img-container">
                        <img src={product.image} alt={product.name} />
                        <div className="absolute top-2 right-2 bg-white text-black text-[9px] font-black px-2 py-1 rounded-sm shadow-xl">
                            ${product.price}
                        </div>
                    </div>
                    <h3 className="font-black text-sm uppercase tracking-wider mb-1 truncate">{product.name}</h3>
                    <p className="text-gray-500 text-[10px] uppercase font-bold leading-tight mb-2 line-clamp-2">{product.description}</p>
                    
                    <div className="rating-badge mb-4">
                        <div className="flex gap-0.5">
                            {[1, 2, 3, 4, 5].map(star => (
                                <i key={star} className="fa-solid fa-star text-[#0070ba] text-[7px]"></i>
                            ))}
                        </div>
                        <span className="text-[9px] font-black text-white">{product.rating}</span>
                        <span className="text-[8px] text-gray-500 font-bold uppercase tracking-widest ml-1">Verified</span>
                    </div>

                    <button 
                        onClick={(e) => { e.stopPropagation(); onAdd(product); }}
                        className="mt-auto w-full bg-[#2a2a2a] group-hover:bg-white group-hover:text-black py-3 text-[10px] font-black uppercase tracking-[0.2em] transition-all rounded-md"
                    >
                        Add to Bag
                    </button>
                </div>
            );
        }

        function App() {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [checkoutStep, setCheckoutStep] = useState(null); 

            const addToCart = (product) => {
                if (!cart.find(item => item.id === product.id)) {
                    setCart([...cart, product]);
                }
                setIsCartOpen(true);
            };

            const removeFromCart = (id) => setCart(cart.filter(item => item.id !== id));
            const total = cart.reduce((s, i) => s + i.price, 0).toFixed(2);
            const categories = ["Programming", "Cars", "Maps", "Scripts", "Clothes"];

            return (
                <div className="min-h-screen">
                    <nav className="fixed top-0 w-full z-50 bg-black/95 border-b border-white/5 h-16 px-6">
                        <div className="max-w-7xl mx-auto h-full flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <i className="fa-solid fa-shield-halved text-white text-xl"></i>
                                <span className="font-black text-sm uppercase tracking-tighter">BLACK STORE</span>
                            </div>
                            <button onClick={() => setIsCartOpen(true)} className="relative hover:scale-110 transition-transform">
                                <i className="fa-solid fa-bag-shopping text-xl"></i>
                                {cart.length > 0 && (
                                    <span className="absolute -top-2 -right-2 bg-white text-black text-[9px] font-black px-1.5 py-0.5 rounded-sm">
                                        {cart.length}
                                    </span>
                                )}
                            </button>
                        </div>
                    </nav>

                    <header className="pt-40 pb-20 px-6 text-center bg-gradient-to-b from-[#1a1a1a] to-[#050505]">
                        <h1 className="text-7xl md:text-9xl font-black tracking-tighter uppercase mb-6 leading-[0.85]">
                            BLACK <span className="text-gray-600 italic">STORE</span>
                        </h1>
                        <p className="text-gray-500 text-[10px] font-bold uppercase tracking-[0.5em] mb-12">Premium Assets • Secure Payments</p>
                        
                        <div className="flex flex-col md:flex-row justify-center items-center gap-4">
                            <a href={PAYPAL_LINK} target="_blank" className="btn-paypal w-full md:w-auto justify-center">
                                <i className="fa-brands fa-paypal text-xl"></i> Pay with PayPal
                            </a>
                            <a href={DISCORD_LINK} target="_blank" className="btn-discord w-full md:w-auto justify-center">
                                <i className="fa-brands fa-discord text-xl"></i> Join Discord
                            </a>
                        </div>
                        <div className="mt-8 flex items-center justify-center gap-2">
                            <i className="fa-solid fa-lock text-[8px] text-gray-500"></i>
                            <span className="text-[8px] font-black text-gray-600 uppercase tracking-widest">End-to-End Secure Transaction</span>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-6 pb-40">
                        {/* Buying Guide */}
                        <div className="mb-40">
                            <div className="section-header">
                                <h2 className="text-3xl font-black uppercase tracking-tighter italic">Official Guide</h2>
                                <span className="text-[9px] font-bold uppercase text-gray-600 tracking-[0.3em]">Direct PayPal Purchasing</span>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                                <div className="relative p-8 bg-[#121212] rounded-3xl border border-white/5">
                                    <span className="step-number absolute top-4 right-8">01</span>
                                    <h3 className="text-xl font-black uppercase italic mb-4">Bag Assets</h3>
                                    <p className="text-gray-500 text-xs font-bold uppercase tracking-wider leading-relaxed">
                                        Select the scripts or MLOs you need. Everything in our store is quality-checked.
                                    </p>
                                </div>
                                <div className="relative p-8 bg-[#121212] rounded-3xl border border-white/5">
                                    <span className="step-number absolute top-4 right-8">02</span>
                                    <h3 className="text-xl font-black uppercase italic mb-4">PayPal Pay</h3>
                                    <p className="text-gray-500 text-xs font-bold uppercase tracking-wider leading-relaxed">
                                        We use PayPal exclusively for its global security and buyer protection standards.
                                    </p>
                                </div>
                                <div className="relative p-8 bg-[#121212] rounded-3xl border border-white/5">
                                    <span className="step-number absolute top-4 right-8">03</span>
                                    <h3 className="text-xl font-black uppercase italic mb-4">Get Files</h3>
                                    <p className="text-gray-500 text-xs font-bold uppercase tracking-wider leading-relaxed">
                                        Download links are generated and sent to your email immediately after verification.
                                    </p>
                                </div>
                            </div>
                        </div>

                        {categories.map(cat => (
                            <div key={cat} className="mb-20">
                                <div className="section-header">
                                    <h2 className="text-3xl font-black uppercase tracking-tighter italic">{cat}</h2>
                                    <span className="text-[9px] font-bold uppercase text-gray-600 tracking-[0.3em]">Elite {cat} Collection</span>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                                    {PRODUCTS.filter(p => p.category === cat).map(item => (
                                        <ProductCard key={item.id} product={item} onAdd={addToCart} />
                                    ))}
                                </div>
                            </div>
                        ))}

                        <div className="mt-40 p-12 md:p-24 rounded-[3rem] bg-[#121212] border border-white/5 text-center relative overflow-hidden paypal-glow">
                            <div className="absolute top-0 left-0 w-full h-full bg-[#0070ba]/5 opacity-50"></div>
                            <div className="relative z-10 flex flex-col items-center">
                                <div className="w-24 h-24 bg-[#0070ba] rounded-[2rem] flex items-center justify-center mb-10 shadow-2xl">
                                    <i className="fa-brands fa-paypal text-5xl"></i>
                                </div>
                                <h2 className="text-5xl md:text-7xl font-black uppercase italic tracking-tighter mb-6">
                                    Safe & Secure
                                </h2>
                                <p className="text-gray-400 text-sm font-bold uppercase tracking-[0.3em] max-w-2xl leading-loose mb-12">
                                    All transactions are processed through PayPal's secure gateway. No card information is ever stored on our servers. Need support? Join our Discord.
                                </p>
                                <div className="flex flex-wrap justify-center gap-8 opacity-40 grayscale">
                                    <i className="fa-brands fa-cc-visa text-4xl"></i>
                                    <i className="fa-brands fa-cc-mastercard text-4xl"></i>
                                    <i className="fa-brands fa-cc-amex text-4xl"></i>
                                    <i className="fa-brands fa-cc-discover text-4xl"></i>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Cart Drawer */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-[100] flex justify-end">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
                            <div className="relative w-full max-w-sm bg-[#080808] border-l border-white/10 h-full p-8 flex flex-col animate-cart">
                                <div className="flex justify-between items-center mb-12">
                                    <h2 className="text-2xl font-black uppercase italic tracking-tighter">Your Bag</h2>
                                    <button onClick={() => setIsCartOpen(false)}><i className="fa-solid fa-xmark text-2xl"></i></button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-4 no-scrollbar">
                                    {cart.length === 0 ? (
                                        <div className="py-20 text-center opacity-20 uppercase font-black text-xs tracking-widest">Empty</div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="flex gap-4 items-center bg-[#121212] p-4 rounded-lg">
                                                <div className="w-12 h-12 bg-black rounded flex items-center justify-center overflow-hidden">
                                                    <img src={item.image} className="w-full h-full object-cover opacity-50" />
                                                </div>
                                                <div className="flex-1">
                                                    <div className="text-[10px] font-black uppercase truncate">{item.name}</div>
                                                    <div className="text-gray-500 text-[10px] font-bold">${item.price}</div>
                                                </div>
                                                <button onClick={() => removeFromCart(item.id)} className="text-gray-700 hover:text-red-500"><i className="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        ))
                                    )}
                                </div>
                                {cart.length > 0 && (
                                    <div className="pt-8 border-t border-white/5">
                                        <div className="flex justify-between mb-8">
                                            <span className="font-black uppercase text-[10px] text-gray-500 tracking-widest">Total</span>
                                            <span className="text-2xl font-black tracking-tighter">${total}</span>
                                        </div>
                                        <button onClick={() => setCheckoutStep('success')} className="w-full bg-[#0070ba] text-white py-4 rounded-full font-black uppercase text-xs tracking-widest hover:opacity-90 flex items-center justify-center gap-3">
                                            <i className="fa-brands fa-paypal"></i> PayPal Checkout
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {checkoutStep === 'success' && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black p-6">
                            <div className="text-center">
                                <div className="w-24 h-24 bg-[#0070ba] rounded-full flex items-center justify-center mx-auto mb-8">
                                    <i className="fa-brands fa-paypal text-4xl text-white"></i>
                                </div>
                                <h2 className="text-5xl font-black uppercase tracking-tighter mb-4 italic">Redirecting</h2>
                                <p className="text-gray-500 text-xs font-bold uppercase tracking-widest mb-8">Logging you into PayPal Secure Gateway...</p>
                                <button onClick={() => {setCheckoutStep(null); setCart([]); setIsCartOpen(false);}} className="bg-white text-black px-12 py-4 rounded-full font-black uppercase tracking-widest text-[10px]">Cancel</button>
                            </div>
                        </div>
                    )}

                    <footer className="bg-black border-t border-white/5 pt-24 pb-12 px-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-12 text-center md:text-left">
                            <div className="flex flex-col gap-2">
                                <div className="flex items-center gap-3 justify-center md:justify-start">
                                    <i className="fa-solid fa-shield-halved text-2xl"></i>
                                    <span className="font-black text-xl tracking-tighter uppercase">BLACK STORE</span>
                                </div>
                                <div className="text-[9px] font-black tracking-[0.4em] uppercase text-gray-700">BLACK STORE &copy; 2026</div>
                            </div>
                            
                            <div className="flex flex-col items-center md:items-end gap-4">
                                <div className="flex gap-8">
                                    <a href={DISCORD_LINK} className="text-gray-600 hover:text-[#5865F2] transition-colors text-2xl"><i className="fa-brands fa-discord"></i></a>
                                    <a href="#" className="text-gray-600 hover:text-white transition-colors text-2xl"><i className="fa-brands fa-twitter"></i></a>
                                    <a href="#" className="text-gray-600 hover:text-white transition-colors text-2xl"><i className="fa-brands fa-instagram"></i></a>
                                </div>
                                <span className="text-[9px] font-black tracking-[0.2em] uppercase text-gray-800">PayPal Verified Merchant</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
