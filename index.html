<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Store | Premium FiveM Assets</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #fff;
            overflow-x: hidden;
        }

        /* Spotify-inspired Card UI */
        .spotify-card {
            background: #121212;
            border-radius: 12px;
            padding: 16px;
            transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .spotify-card:hover {
            background: #1f1f1f;
        }

        .img-container {
            aspect-ratio: 1;
            background: #282828;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .spotify-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        /* Premium Pill Button (Spotify Green) */
        .btn-spotify-pill {
            background-color: #1DB954;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 14px 36px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.2);
        }
        .btn-spotify-pill:hover {
            transform: scale(1.05);
            background-color: #1ed760;
        }

        .section-header {
            border-left: 3px solid #fff;
            padding-left: 1rem;
            margin-bottom: 2rem;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes slide-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-cart { animation: slide-in 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        .rating-badge {
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        /* Discord Section Glow */
        .discord-glow {
            box-shadow: 0 0 50px rgba(88, 101, 242, 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DISCORD_LINK = "https://discord.gg/CaN4PcNkR2";
        const FIVERR_LINK = "https://www.fiverr.com"; 

        const PRODUCTS = [
            { id: 10, name: "Custom Discord Programming", category: "Programming", price: 25.00, image: "spotify-icon", rating: 5.0, description: "Personalized script modification or custom Discord bot integration." },
            { id: 5, name: "Hypercar Collection Vol. 1", category: "Cars", price: 59.99, image: "https://images.unsplash.com/photo-1544636331-e26879cd4d9b?q=80&w=600&auto=format&fit=crop", rating: 4.9, description: "5 highly detailed hypercars with custom handling." },
            { id: 6, name: "Off-Road Monster Pack", category: "Cars", price: 44.99, image: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?q=80&w=600&auto=format&fit=crop", rating: 4.8, description: "Rugged terrain vehicles for Blaine County." },
            { id: 2, name: "Bennys Luxury Garage MLO", category: "Maps", price: 34.99, image: "https://images.unsplash.com/photo-1614332287897-cdc485fa562d?q=80&w=600&auto=format&fit=crop", rating: 5.0, description: "Custom textured garage with 12 slots and office." },
            { id: 7, name: "Underground Fight Club", category: "Maps", price: 29.99, image: "https://images.unsplash.com/photo-1511886929837-354d827aae26?q=80&w=600&auto=format&fit=crop", rating: 4.7, description: "Secret MLO located beneath Legion Square." },
            { id: 1, name: "Ultra Housing System v3", category: "Scripts", price: 49.99, image: "https://images.unsplash.com/photo-1558021212-51b6ecfa0db9?q=80&w=600&auto=format&fit=crop", rating: 4.9, description: "Advanced decoration system with real estate agent job." },
            { id: 4, name: "Dynamic Drug Labs", category: "Scripts", price: 39.99, image: "https://images.unsplash.com/photo-1587202395167-33f760f38101?q=80&w=600&auto=format&fit=crop", rating: 5.0, description: "Crafting systems for Meth, Coke, and Weed." },
            { id: 3, name: "Tactical LSPD EUP Pack", category: "Clothes", price: 24.99, image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=600&auto=format&fit=crop", rating: 4.6, description: "High-quality vests and badges for RP servers." }
        ];

        function ProductCard({ product, onAdd }) {
            return (
                <div className="spotify-card flex flex-col group">
                    <div className="img-container">
                        {product.image === "spotify-icon" ? (
                            <div className="w-full h-full flex items-center justify-center bg-[#191414]">
                                <i className="fa-brands fa-spotify text-7xl text-[#1DB954] drop-shadow-[0_0_15px_rgba(29,185,84,0.4)]"></i>
                            </div>
                        ) : (
                            <img src={product.image} alt={product.name} />
                        )}
                        <div className="absolute top-2 right-2 bg-white text-black text-[9px] font-black px-2 py-1 rounded-sm shadow-xl">
                            ${product.price}
                        </div>
                    </div>
                    <h3 className="font-black text-sm uppercase tracking-wider mb-1 truncate">{product.name}</h3>
                    <p className="text-gray-500 text-[10px] uppercase font-bold leading-tight mb-2 line-clamp-2">{product.description}</p>
                    
                    <div className="rating-badge mb-4">
                        <div className="flex gap-0.5">
                            {[1, 2, 3, 4, 5].map(star => (
                                <i key={star} className="fa-solid fa-star text-[#1DB954] text-[7px]"></i>
                            ))}
                        </div>
                        <span className="text-[9px] font-black text-white">{product.rating}</span>
                        <span className="text-[8px] text-gray-500 font-bold uppercase tracking-widest ml-1">Excellent</span>
                    </div>

                    <button 
                        onClick={(e) => { e.stopPropagation(); onAdd(product); }}
                        className="mt-auto w-full bg-[#2a2a2a] group-hover:bg-white group-hover:text-black py-3 text-[10px] font-black uppercase tracking-[0.2em] transition-all rounded-md"
                    >
                        Add to Cart
                    </button>
                </div>
            );
        }

        function App() {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [checkout, setCheckout] = useState(false);

            const addToCart = (product) => {
                if (!cart.find(item => item.id === product.id)) {
                    setCart([...cart, product]);
                }
                setIsCartOpen(true);
            };

            const removeFromCart = (id) => setCart(cart.filter(item => item.id !== id));
            const total = cart.reduce((s, i) => s + i.price, 0).toFixed(2);
            const categories = ["Programming", "Cars", "Maps", "Scripts", "Clothes"];

            return (
                <div className="min-h-screen">
                    <nav className="fixed top-0 w-full z-50 bg-black/95 border-b border-white/5 h-16 px-6">
                        <div className="max-w-7xl mx-auto h-full flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <i className="fa-solid fa-bolt text-white text-xl"></i>
                                <span className="font-black text-sm uppercase tracking-tighter">BLACK STORE</span>
                            </div>
                            <button onClick={() => setIsCartOpen(true)} className="relative hover:scale-110 transition-transform">
                                <i className="fa-solid fa-cart-shopping text-xl"></i>
                                {cart.length > 0 && (
                                    <span className="absolute -top-2 -right-2 bg-white text-black text-[9px] font-black px-1.5 py-0.5 rounded-sm">
                                        {cart.length}
                                    </span>
                                )}
                            </button>
                        </div>
                    </nav>

                    <header className="pt-40 pb-20 px-6 text-center bg-gradient-to-b from-[#1a1a1a] to-[#050505]">
                        <h1 className="text-7xl md:text-9xl font-black tracking-tighter uppercase mb-6 leading-[0.85]">
                            BLACK <span className="text-gray-600 italic">STORE</span>
                        </h1>
                        <p className="text-gray-500 text-[10px] font-bold uppercase tracking-[0.5em] mb-12">Premium Assets & Custom Code</p>
                        
                        <div className="flex flex-col sm:flex-row gap-4 justify-center items-center">
                            <div className="flex flex-col items-center gap-2">
                                <a href={DISCORD_LINK} target="_blank" className="bg-[#5865F2] hover:bg-[#4752c4] text-white px-10 py-4 rounded-full font-black uppercase tracking-widest text-[11px] flex items-center justify-center gap-3 transition-all">
                                    <i className="fa-brands fa-discord text-xl"></i> Discord
                                </a>
                                <span className="text-[8px] font-black text-gray-600 uppercase tracking-widest">Active Community</span>
                            </div>
                            <div className="flex flex-col items-center gap-2">
                                <a href={FIVERR_LINK} target="_blank" className="btn-spotify-pill justify-center">
                                    <i className="fa-brands fa-spotify text-xl"></i> Fiverr Gigs
                                </a>
                                <div className="flex items-center gap-1">
                                    {[1,2,3,4,5].map(i => <i key={i} className="fa-solid fa-star text-[7px] text-yellow-500"></i>)}
                                    <span className="text-[8px] font-black text-[#1DB954] uppercase ml-1">Top Rated Seller</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-6 pb-40">
                        {categories.map(cat => (
                            <div key={cat} className="mb-20">
                                <div className="section-header">
                                    <h2 className="text-3xl font-black uppercase tracking-tighter italic">{cat}</h2>
                                    <span className="text-[9px] font-bold uppercase text-gray-600 tracking-[0.3em]">Elite {cat} Collection</span>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                                    {PRODUCTS.filter(p => p.category === cat).map(item => (
                                        <ProductCard key={item.id} product={item} onAdd={addToCart} />
                                    ))}
                                </div>
                            </div>
                        ))}

                        {/* Updated Community Section without Chat Preview */}
                        <div className="mt-40 p-12 md:p-24 rounded-[3rem] bg-[#121212] border border-white/5 text-center relative overflow-hidden discord-glow">
                            <div className="absolute top-0 left-0 w-full h-full bg-[#5865F2]/5 opacity-50"></div>
                            <div className="relative z-10 flex flex-col items-center">
                                <div className="w-24 h-24 bg-[#5865F2] rounded-[2rem] flex items-center justify-center mb-10 shadow-2xl">
                                    <i className="fa-brands fa-discord text-5xl"></i>
                                </div>
                                <h2 className="text-5xl md:text-7xl font-black uppercase italic tracking-tighter mb-6">
                                    Elite Community
                                </h2>
                                <p className="text-gray-400 text-sm font-bold uppercase tracking-[0.3em] max-w-2xl leading-loose mb-12">
                                    Join thousands of professional developers and server owners. Get exclusive early access to scripts and 24/7 dedicated support.
                                </p>
                                <a href={DISCORD_LINK} className="bg-white text-black px-16 py-5 rounded-full font-black uppercase tracking-[0.4em] text-[11px] transition-all hover:scale-105 hover:bg-[#5865F2] hover:text-white">
                                    Enter Discord
                                </a>
                                <div className="mt-12 flex items-center gap-4">
                                    <span className="w-3 h-3 bg-[#23a559] rounded-full animate-pulse"></span>
                                    <span className="text-[10px] font-black uppercase tracking-widest text-gray-500">Live Community Support Active</span>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Cart Drawer */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-[100] flex justify-end">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
                            <div className="relative w-full max-w-sm bg-[#080808] border-l border-white/10 h-full p-8 flex flex-col animate-cart">
                                <div className="flex justify-between items-center mb-12">
                                    <h2 className="text-2xl font-black uppercase italic tracking-tighter">Your Bag</h2>
                                    <button onClick={() => setIsCartOpen(false)}><i className="fa-solid fa-xmark text-2xl"></i></button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-4 no-scrollbar">
                                    {cart.length === 0 ? (
                                        <div className="py-20 text-center opacity-20 uppercase font-black text-xs tracking-widest">Empty</div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="flex gap-4 items-center bg-[#121212] p-4 rounded-lg">
                                                <div className="w-12 h-12 bg-black rounded flex items-center justify-center overflow-hidden">
                                                    {item.image === "spotify-icon" ? (
                                                        <i className="fa-brands fa-spotify text-[#1DB954]"></i>
                                                    ) : (
                                                        <img src={item.image} className="w-full h-full object-cover opacity-50" />
                                                    )}
                                                </div>
                                                <div className="flex-1">
                                                    <div className="text-[10px] font-black uppercase truncate">{item.name}</div>
                                                    <div className="text-gray-500 text-[10px] font-bold">${item.price}</div>
                                                </div>
                                                <button onClick={() => removeFromCart(item.id)} className="text-gray-700 hover:text-red-500"><i className="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        ))
                                    )}
                                </div>
                                {cart.length > 0 && (
                                    <div className="pt-8 border-t border-white/5">
                                        <div className="flex justify-between mb-8">
                                            <span className="font-black uppercase text-[10px] text-gray-500 tracking-widest">Total</span>
                                            <span className="text-2xl font-black tracking-tighter">${total}</span>
                                        </div>
                                        <button onClick={() => setCheckout(true)} className="w-full bg-[#FFD700] text-black py-4 rounded-full font-black uppercase text-xs tracking-widest hover:opacity-90">
                                            Checkout Now
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {checkout && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black p-6">
                            <div className="text-center">
                                <div className="w-24 h-24 bg-[#1DB954] rounded-full flex items-center justify-center mx-auto mb-8">
                                    <i className="fa-solid fa-check text-4xl text-black"></i>
                                </div>
                                <h2 className="text-5xl font-black uppercase tracking-tighter mb-4 italic">Success</h2>
                                <button onClick={() => {setCheckout(false); setCart([]); setIsCartOpen(false);}} className="bg-white text-black px-12 py-4 rounded-full font-black uppercase tracking-widest text-[10px]">Close</button>
                            </div>
                        </div>
                    )}

                    <footer className="bg-black border-t border-white/5 pt-24 pb-12 px-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-12">
                            <div className="flex items-center gap-3">
                                <i className="fa-solid fa-bolt text-2xl"></i>
                                <span className="font-black text-xl tracking-tighter uppercase">BLACK STORE</span>
                            </div>
                            <div className="flex gap-8">
                                <a href="#" className="text-gray-600 hover:text-white transition-colors"><i className="fa-brands fa-twitter"></i></a>
                                <a href="#" className="text-gray-600 hover:text-white transition-colors"><i className="fa-brands fa-instagram"></i></a>
                                <a href={DISCORD_LINK} className="text-gray-600 hover:text-white transition-colors"><i className="fa-brands fa-discord"></i></a>
                            </div>
                            <div className="text-[9px] font-black tracking-[0.4em] uppercase text-gray-700">BLACK STORE &copy; 2024</div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
