<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Store | Premium FiveM Assets</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #fff;
            overflow-x: hidden;
        }

        .spotify-card {
            background: #121212;
            border-radius: 12px;
            padding: 16px;
            transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .spotify-card:hover {
            background: #1f1f1f;
        }

        .img-container {
            aspect-ratio: 1;
            background: #282828;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .spotify-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        .btn-paypal {
            background-color: #0070ba;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 14px 36px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 112, 186, 0.2);
        }
        .btn-paypal:hover {
            transform: scale(1.05);
            background-color: #005ea6;
        }

        .btn-discord {
            background-color: #5865F2;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 14px 36px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.2);
        }
        .btn-discord:hover {
            transform: scale(1.05);
            background-color: #4752c4;
        }

        .section-header {
            border-left: 3px solid #fff;
            padding-left: 1rem;
            margin-bottom: 2rem;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes slide-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-cart { animation: slide-in 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        .rating-badge {
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        .paypal-glow {
            box-shadow: 0 0 50px rgba(0, 112, 186, 0.1);
        }

        .step-number {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            -webkit-text-stroke: 1px rgba(255,255,255,0.1);
            color: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // EDIT THIS LINK: Replace with your actual PayPal.me link or payment URL
        const PAYPAL_LINK = "https://www.paypal.com/paypalme/YOUR_USERNAME"; 
        const DISCORD_LINK = "https://discord.gg/CaN4PcNkR2";

        const PRODUCTS = [
            { id: 10, name: "Custom discord Programming", category: "Programming", price: 25.00, image: "https://cdn3.emoji.gg/emojis/18148-developer-badge.png", rating: 5.0, description: "Discord Bot for server automation and management systems." },
            { id: 9, name: "Custom fivem Programming", category: "Programming", price: 30.00, image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRg6DQ9nS42PFrISGnBkCphoos2eYFU3b1O4A&s", rating: 5.0, description: "Professional FiveM server development and script optimization." },
            { id: 5, name: "Citizen cars Pack. 1", category: "Cars", price: 55.00, image: "https://img.gta5-mods.com/q95/images/lore-friendly-tuning-colors-add-on/87ba2d-20210101020836_1.jpg", rating: 4.9, description: "Premium pack of 5 high-quality citizen cars optimized for FiveM." },
            { id: 6, name: "POLICE Israel Pack", category: "Cars", price: 24.99, image: "https://img.gta5-mods.com/q75/images/israel-kia-sorento-add-on-fivem-ready-replace-els/446827-1.png", rating: 4.8, description: "High-detail Israel Police vehicle pack with ELS support." },
            { id: 2, name: "Exclusive MLO - Coming Soon", category: "Maps", price: 0.0, image: "https://images.unsplash.com/photo-1614332287897-cdc485fa562d?q=80&w=600&auto=format&fit=crop", rating: 5.0, description: "New custom interior map under development." },
            { id: 1, name: "Admin Package Script", category: "Scripts", price: 39.99, image: "https://media.discordapp.net/attachments/1490826181883461772/1494479198289662114/banerr.png?ex=69f9d3f6&is=69f88276&hm=dc76513a5133a4db45cd169277bf8bab2110a00af25b73b12c47bc81e7f857b8&=&format=webp&quality=lossless", rating: 4.9, description: "Complete server management and administration toolkit." },
            { id: 4, name: "Casino System Script", category: "Scripts", price: 29.99, image: "https://img.magnific.com/vector-gratis/ilustracion-realista-juegos-casino_52683-99917.jpg?semt=ais_hybrid&w=740&q=80", rating: 5.0, description: "Advanced Casino script with slots and table games." },
            { id: 3, name: "Citizen Clothes Pack", category: "Clothes", price: 24.99, image: "https://media.discordapp.net/attachments/1498289607136120936/1500941325414174891/image.png?ex=69fa440a&is=69f8f28a&hm=eb739238406a8c0023911d3918cb3b792937dec1817714d928f9242773d95a3f&=&format=webp&quality=lossless", rating: 4.6, description: "Custom 4K textures clothes pack for FiveM characters." }
        ];

        function ProductCard({ product, onAdd }) {
            return (
                <div className="spotify-card flex flex-col group">
                    <div className="img-container">
                        <img src={product.image} alt={product.name} />
                        <div className="absolute top-2 right-2 bg-white text-black text-[9px] font-black px-2 py-1 rounded-sm shadow-xl">
                            ${product.price}
                        </div>
                    </div>
                    <h3 className="font-black text-sm uppercase tracking-wider mb-1 truncate">{product.name}</h3>
                    <p className="text-gray-500 text-[10px] uppercase font-bold leading-tight mb-2 line-clamp-2">{product.description}</p>
                    
                    <div className="rating-badge mb-4">
                        <div className="flex gap-0.5">
                            {[1, 2, 3, 4, 5].map(star => (
                                <i key={star} className="fa-solid fa-star text-[#0070ba] text-[7px]"></i>
                            ))}
                        </div>
                        <span className="text-[9px] font-black text-white">{product.rating}</span>
                        <span className="text-[8px] text-gray-500 font-bold uppercase tracking-widest ml-1">Verified</span>
                    </div>

                    <button 
                        onClick={(e) => { e.stopPropagation(); onAdd(product); }}
                        className="mt-auto w-full bg-[#2a2a2a] group-hover:bg-white group-hover:text-black py-3 text-[10px] font-black uppercase tracking-[0.2em] transition-all rounded-md"
                    >
                        Add to Bag
                    </button>
                </div>
            );
        }

        function App() {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [checkoutStep, setCheckoutStep] = useState(null); 

            const addToCart = (product) => {
                if (!cart.find(item => item.id === product.id)) {
                    setCart([...cart, product]);
                }
                setIsCartOpen(true);
            };

            const handleCheckout = () => {
                setCheckoutStep('redirecting');
                // Simulate processing then open payment link
                setTimeout(() => {
                    window.open(PAYPAL_LINK, '_blank');
                    setCheckoutStep('success');
                }, 2000);
            };

            const removeFromCart = (id) => setCart(cart.filter(item => item.id !== id));
            const total = cart.reduce((s, i) => s + i.price, 0).toFixed(2);
            const categories = ["Programming", "Cars", "Maps", "Scripts", "Clothes"];

            return (
                <div className="min-h-screen">
                    <nav className="fixed top-0 w-full z-50 bg-black/95 border-b border-white/5 h-16 px-6">
                        <div className="max-w-7xl mx-auto h-full flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <i className="fa-solid fa-shield-halved text-white text-xl"></i>
                                <span className="font-black text-sm uppercase tracking-tighter">BLACK STORE</span>
                            </div>
                            <button onClick={() => setIsCartOpen(true)} className="relative hover:scale-110 transition-transform">
                                <i className="fa-solid fa-bag-shopping text-xl"></i>
                                {cart.length > 0 && (
                                    <span className="absolute -top-2 -right-2 bg-white text-black text-[9px] font-black px-1.5 py-0.5 rounded-sm">
                                        {cart.length}
                                    </span>
                                )}
                            </button>
                        </div>
                    </nav>

                    <header className="pt-40 pb-20 px-6 text-center bg-gradient-to-b from-[#1a1a1a] to-[#050505]">
                        <h1 className="text-7xl md:text-9xl font-black tracking-tighter uppercase mb-6 leading-[0.85]">
                            BLACK <span className="text-gray-600 italic">STORE</span>
                        </h1>
                        <p className="text-gray-500 text-[10px] font-bold uppercase tracking-[0.5em] mb-12">Premium Assets • Secure Payments</p>
                        
                        <div className="flex flex-col md:flex-row justify-center items-center gap-4">
                            <a href={DISCORD_LINK} target="_blank" className="btn-discord w-full md:w-auto justify-center">
                                <i className="fa-brands fa-discord text-xl"></i> Join Community
                            </a>
                            <div className="flex items-center gap-2">
                                <i className="fa-solid fa-lock text-[8px] text-gray-500"></i>
                                <span className="text-[8px] font-black text-gray-600 uppercase tracking-widest">PayPal Verified Business</span>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-6 pb-40">
                        {/* Status Message */}
                        <div className="bg-blue-900/20 border border-blue-500/20 p-4 rounded-xl mb-20 flex items-center justify-center gap-4">
                            <i className="fa-solid fa-info-circle text-blue-400"></i>
                            <span className="text-[10px] font-bold uppercase tracking-widest text-blue-200">After payment via PayPal, send your receipt to our Discord for instant delivery.</span>
                        </div>

                        {categories.map(cat => (
                            <div key={cat} className="mb-20">
                                <div className="section-header">
                                    <h2 className="text-3xl font-black uppercase tracking-tighter italic">{cat}</h2>
                                    <span className="text-[9px] font-bold uppercase text-gray-600 tracking-[0.3em]">Exclusive {cat}</span>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                                    {PRODUCTS.filter(p => p.category === cat).map(item => (
                                        <ProductCard key={item.id} product={item} onAdd={addToCart} />
                                    ))}
                                </div>
                            </div>
                        ))}
                    </main>

                    {/* Cart Drawer */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-[100] flex justify-end">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
                            <div className="relative w-full max-w-sm bg-[#080808] border-l border-white/10 h-full p-8 flex flex-col animate-cart">
                                <div className="flex justify-between items-center mb-12">
                                    <h2 className="text-2xl font-black uppercase italic tracking-tighter">Shopping Bag</h2>
                                    <button onClick={() => setIsCartOpen(false)}><i className="fa-solid fa-xmark text-2xl"></i></button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-4 no-scrollbar">
                                    {cart.length === 0 ? (
                                        <div className="py-20 text-center opacity-20 uppercase font-black text-xs tracking-widest">Your bag is empty</div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="flex gap-4 items-center bg-[#121212] p-4 rounded-lg">
                                                <div className="w-12 h-12 bg-black rounded flex items-center justify-center overflow-hidden">
                                                    <img src={item.image} className="w-full h-full object-cover opacity-50" />
                                                </div>
                                                <div className="flex-1">
                                                    <div className="text-[10px] font-black uppercase truncate">{item.name}</div>
                                                    <div className="text-gray-500 text-[10px] font-bold">${item.price}</div>
                                                </div>
                                                <button onClick={() => removeFromCart(item.id)} className="text-gray-700 hover:text-red-500 transition-colors"><i className="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        ))
                                    )}
                                </div>
                                {cart.length > 0 && (
                                    <div className="pt-8 border-t border-white/5">
                                        <div className="flex justify-between mb-8">
                                            <span className="font-black uppercase text-[10px] text-gray-500 tracking-widest">Grand Total</span>
                                            <span className="text-2xl font-black tracking-tighter">${total}</span>
                                        </div>
                                        <button onClick={handleCheckout} className="w-full bg-[#0070ba] text-white py-4 rounded-full font-black uppercase text-xs tracking-widest hover:opacity-90 transition-all flex items-center justify-center gap-3">
                                            <i className="fa-brands fa-paypal"></i> Buy Now with PayPal
                                        </button>
                                        <p className="text-[8px] text-center text-gray-600 mt-4 uppercase font-bold tracking-widest">Instant money delivery to merchant account</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Checkout Overlay */}
                    {checkoutStep && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/95 backdrop-blur-lg p-6">
                            <div className="text-center max-w-sm">
                                {checkoutStep === 'redirecting' ? (
                                    <>
                                        <div className="w-20 h-20 border-4 border-[#0070ba] border-t-transparent rounded-full animate-spin mx-auto mb-8"></div>
                                        <h2 className="text-4xl font-black uppercase tracking-tighter mb-4 italic">Processing</h2>
                                        <p className="text-gray-500 text-[10px] font-bold uppercase tracking-widest">Establishing secure connection to PayPal...</p>
                                    </>
                                ) : (
                                    <>
                                        <div className="w-24 h-24 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-8 shadow-[0_0_50px_rgba(34,197,94,0.3)]">
                                            <i className="fa-solid fa-check text-4xl text-white"></i>
                                        </div>
                                        <h2 className="text-4xl font-black uppercase tracking-tighter mb-4 italic">Payment Opened</h2>
                                        <p className="text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-10 leading-relaxed">
                                            The payment page has opened in a new tab. Once you complete the payment, please send the receipt to our Discord to receive your files.
                                        </p>
                                        <div className="flex flex-col gap-3">
                                            <a href={DISCORD_LINK} target="_blank" className="bg-[#5865F2] text-white py-4 rounded-full font-black uppercase tracking-widest text-[10px]">Go to Discord</a>
                                            <button onClick={() => setCheckoutStep(null)} className="text-gray-500 text-[9px] font-black uppercase tracking-widest">Close Window</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    <footer className="bg-black border-t border-white/5 pt-24 pb-12 px-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-12 text-center md:text-left">
                            <div className="flex flex-col gap-2">
                                <div className="flex items-center gap-3 justify-center md:justify-start">
                                    <i className="fa-solid fa-shield-halved text-2xl"></i>
                                    <span className="font-black text-xl tracking-tighter uppercase">BLACK STORE</span>
                                </div>
                                <div className="text-[9px] font-black tracking-[0.4em] uppercase text-gray-700">OFFICIAL MERCHANT &copy; 2026</div>
                            </div>
                            
                            <div className="flex flex-col items-center md:items-end gap-4">
                                <div className="flex gap-8">
                                    <a href={DISCORD_LINK} className="text-gray-600 hover:text-[#5865F2] transition-colors text-2xl"><i className="fa-brands fa-discord"></i></a>
                                    <a href="#" className="text-gray-600 hover:text-white transition-colors text-2xl"><i className="fa-brands fa-twitter"></i></a>
                                </div>
                                <span className="text-[9px] font-black tracking-[0.2em] uppercase text-gray-800">Payments Protected by PayPal</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
